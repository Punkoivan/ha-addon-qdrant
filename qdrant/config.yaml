name: Qdrant
version: "1.1.0"
slug: qdrant
description: Qdrant vector database — local vector search for AI and RAG applications
url: https://github.com/punkoivan/ha-addon-qdrant
arch:
  - aarch64
  - amd64
startup: services
boot: auto
ports:
  6333/tcp: 6333
  6334/tcp: 6334
ports_description:
  6333/tcp: Qdrant REST API
  6334/tcp: Qdrant gRPC API
map:
  - type: ssl
    read_only: true
options:
  log_level: info
  api_key: ""
  read_only_api_key: ""
  tls: false
  certfile: ""
  keyfile: ""
schema:
  log_level: list(debug|info|warn|error)
  api_key: str
  read_only_api_key: str
  tls: bool
  certfile: str
  keyfile: str
image: ghcr.io/punkoivan/ha-addon-qdrant/qdrant-{arch}
